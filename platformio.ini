[platformio]
default_envs = nodemcuv2

[env]
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_deps =
    olikraus/U8g2@2.36.18
    bblanchon/ArduinoJson@7.4.3

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
board_build.filesystem = littlefs
